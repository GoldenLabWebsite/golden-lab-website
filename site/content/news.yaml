    body: "Sam was very excited to be hosted by Dr. Jacob Nordman from SIU Medicine in Illinois!"
  - date: "2024-09-02"
    title: "Golden Lab highlighted by KING5 news"
    body: >
      KING5 Seattle News highlighted some of the work from our lab this week! This highlight
      focused on ongoing efforts to understand fentanyl addiction, with fantastic views of
      Jovana, Carlie, Hallie, and others in action!!
  - date: "2024-08-30"
    title: "Congratulations to Kevin Bai for receiving a WRF Levinson Emerging Scholar Award"
    body: >
      Kevin Bai, rising undergraduate senior in the lab, has been awarded a prestigious WRF
      Levinson Emerging Scholar Award! This follows his recent success also being awarded a
      3Rs Pilot Grant! Congrats Kevin!
  - date: "2024-08-28"
    title: "Collaboration with Zweifel lab published in Cell Reports"
    body: >
      Excited to share work by Jordan Elum from the Zweifel Lab, in collaboration with Eric
      Szelenyi, published in Cell Reports: "Distinct dynamics and intrinsic properties in
      ventral tegmental area populations mediate reward association and motivation." See the
      Publications page for the full citation.
  - date: "2024-08-28"
    title: "Sam teaches at the FENS Summer Workshop in Lausanne!"
    body: "Sam teaches at the FENS Summer Workshop in Lausanne!"
  - date: "2024-08-14"
    title: "Kelsey presents at UW ENDURE Symposium!"

  - date: "2024-08-12"
    title: "Notice of Award for R44 SBIR Phase 2 with Neurolux and Heshmati Lab"
    body: >
      We have received the Notice of Award for a collaborative R44 SBIR Phase 2 with Neurolux
      and the Heshmati Lab. This NIMH award will support the development of BMADs and
      associated software/hardware through the end of 2026!
  - date: "2024-08-07"
    title: "Carlee presents at IASP 2024 World Congress on Pain in Amsterdam"
    body: "Carlee Toddes presented at IASP 2024 World Congress on Pain in Amsterdam. Carlee received a travel award to support her trip."
  - date: "2024-08-05"
    title: "ArgiNLS manuscript selected as \"Publication of the Week\" by Science in Seattle!"
    body: "ArgiNLS manuscript selected as \"Publication of the Week\" by Science in Seattle!"
  - date: "2024-08-02"
    title: "Nastacia publishes a SimBA Primer at NPP-DPN"
    body: >
      Nastacia has published a brief Primer on SimBA at NPP-DPN. This primer is for people who
      are new to the field of ML behavioral analysis and would like to get an idea of where to
      start!

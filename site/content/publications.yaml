  authors: Caprioli D, Golden SA, Baunez C, Venniro M.
  title: 'Editorial: Spanning the spectrum of social behavior: towards more translationally relevant animal models.'
  journal: Psychopharmacology (Berl).
  detail: 2025 May;242(5):885-887.
  doi: 10.1007/s00213-025-06755-5
  abstract: Our mechanistic understanding of neuropsychiatric disorders is primarily based on preclinical studies using animal models (Shemesh and Chen 2023). However, despite the emergence of powerful new technologies, the translation and development of effective therapeutic treatments from these models and direct improvements to health outcomes has been slow (Venniro et al. 2020). We believe this impasse is partly due to limitations in animal models, particularly the omission of key social factors, which play a major role in the etiology of human psychiatric disorders (Heilig et al. 2016). Social factors encompass ethologically complex behaviors ranging from positive affiliative social interactions to agitation and aggression. Both affiliative and aggressive interactions can be rewarding for humans and laboratory animals. Recently, efforts to enhance the translational relevance of rodent models have increasingly incorporated these behaviors to better understand their effects on neuropsychiatric
    disorders and their underlying neural mechanisms (Golden et al. 2017; Navarrete et al. 2024; Ramsey et al. 2022; Venniro et al. 2018). Building on these directions, we organized a workshop for the European Behavioral Pharmacology Society (EBPS) to bridge the gap between researchers studying social factors and behavioral neuroscientists investigating neuropsychiatric disorders. The workshop aimed to create a collaborative forum focused on leveraging translationally relevant models of social behavior to investigate neuropsychiatric disorders. By doing so, we sought to facilitate future collaborations that use social behavior to bridge the translational gap between preclinical models and their clinical counterparts, improving strategies for identifying novel therapeutic targets for effective treatment of neuropsychiatric disorders.
- year: 2024
  authors: Elum JE, Szelenyi ER, Juarez B, Murry AD, Loginov G, Zamorano CA, Gao P, Wu G, Ng-Evans S, Yee JX, Xu X, Golden SA, Zweifel LS
  title: Distinct dynamics and intrinsic properties in ventral tegmental area populations mediate reward association and motivation.
  journal: Cell Rep.
  detail: 2024 Aug 27;43(9):114668.
  doi: 10.1016/j.celrep.2024.114668
  abstract: Ventral tegmental area (VTA) dopamine neurons regulate reward-related associative learning and reward-driven motivated behaviors, but how these processes are coordinated by distinct VTA neuronal subpopulations remains unresolved. Here, we compare the contribution of two primarily dopaminergic and largely non-overlapping VTA subpopulations, all VTA dopamine neurons and VTA GABAergic neurons of the mouse midbrain, to these processes. We find that the dopamine subpopulation that projects to the nucleus accumbens (NAc) core preferentially encodes reward-predictive cues and prediction errors. In contrast, the subpopulation that projects to the NAc shell preferentially encodes goal-directed actions and relative reward anticipation. VTA GABA neuron activity strongly contrasts VTA dopamine population activity and preferentially encodes reward outcome and retrieval. Electrophysiology, targeted optogenetics, and whole-brain input mapping reveal multiple convergent sources that contribute
    to the heterogeneity among VTA dopamine subpopulations that likely underlies their distinct encoding of reward-related associations and motivation that defines their functions in these contexts.
- year: 2024
  authors: Goodwin NL, Golden SA.
  title: Keeping it simple – a Simple Behavioral Analysis (SimBA) primer.
  journal: NPP—Digital Psychiatry and Neuroscience
  detail: 2, 13 (2024).
  doi: 10.1038/s44277-024-00014-9
  abstract: Goodwin NL, Golden SA. Neuroscience is approaching a critical juncture, transitioning from subjective behavioral observation to objective behavioral definition. This is now possible due to analytical tools using machine-guided solutions for animal markerless key-point pose tracking (see Table 1 for specialized terminology definitions) and behavioral detection. However, it is often challenging for behaviorists to adopt these approaches due to a lack of specialized computational knowledge. We and others have spent significant effort to solve this problem by democratizing access to these approaches, making them accessible to non-specialists. However, as these tools increase access to machine learning approaches, an emerging problem is ensuring that the predictions algorithms are making and the biology that they are defining are explainable and understandable. To address these challenges, we have introduced Simple Behavioral Analysis (SimBA) as an open-source, supervised machine
    learning based platform for the automated detection of behavior, with a focus on understanding how the underlying machine learning algorithms make their decisions.
- year: 2024
  authors: Szelenyi ER, Navarrete JS, Murry AD, et al.
  title: An arginine-rich nuclear localization signal (ArgiNLS) strategy for streamlined image segmentation of single cells.
  journal: Proc Natl Acad Sci U S A.
  detail: 2024 Aug 6;121(32):e2320250121.
  doi: 10.1073/pnas.2320250121
  abstract: Szelenyi ER, Navarrete JS, Murry AD, Zhang Y, Girven KS, Kuo L, Cline MM, Bernstein MX, Burdyniuk M, Bowler B, Goodwin NL, Juarez B, Zweifel LS, Golden SA. High-throughput volumetric fluorescent microscopy pipelines can spatially integrate whole-brain structure and function at the foundational level of single cells. However, conventional fluorescent protein (FP) modifications used to discriminate single cells possess limited efficacy or are detrimental to cellular health. Here, we introduce a synthetic and nondeleterious nuclear localization signal (NLS) tag strategy, called “Arginine-rich NLS” (ArgiNLS), that optimizes genetic labeling and downstream image segmentation of single cells by restricting FP localization near-exclusively in the nucleus through a poly-arginine mechanism. A single N-terminal ArgiNLS tag provides modular nuclear restriction consistently across spectrally separate FP variants. ArgiNLS performance in vivo displays functional conservation across major cortical
    cell classes and in response to both local and systemic brain-wide AAV administration. Crucially, the high signal-to-noise ratio afforded by ArgiNLS enhances machine learning-automated segmentation of single cells due to rapid classifier training and enrichment of labeled cell detection within 2D brain sections or 3D volumetric whole-brain image datasets, derived from both staining-amplified and native signal. This genetic strategy provides a simple and flexible basis for precise image segmentation of genetically labeled single cells at scale and paired with behavioral procedures.
- year: 2024
  authors: Goodwin NL, Choong JJ, Hwang S, et al.
  title: Simple Behavioral Analysis (SimBA) as a platform for explainable machine learning in behavioral neuroscience.
  journal: Nature Neuroscience.
  detail: 2024 May 22.
  doi: 10.1038/s41593-024-01649-9
  abstract: Goodwin NL, Choong JJ, Hwang S, Pitts K, Bloom L, Islam A, Zhang YY, Szelenyi ER, Tong X, Newman EL, Miczek K, Wright HR, McLaughlin RJ, Norville ZC, Eshel N, Heshmati M, Nilsson SRO*, Golden SA*. The study of complex behaviors is often challenging when using manual annotation due to the absence of quantifiable behavioral definitions and the subjective nature of behavioral annotation. Integration of supervised machine learning approaches mitigates some of these issues through the inclusion of accessible and explainable model interpretation. To decrease barriers to access, and with an emphasis on accessible model explainability, we developed the open-source Simple Behavioral Analysis (SimBA) platform for behavioral neuroscientists. SimBA introduces several machine learning interpretability tools, including SHapley Additive exPlanation (SHAP) scores, that aid in creating explainable and transparent behavioral classifiers. Here we show how the addition of explainability metrics
    allows for quantifiable comparisons of aggressive social behavior across research groups and species, reconceptualizing behavior as a sharable reagent and providing an open-source framework. We provide an open-source, graphical user interface (GUI)-driven, well-documented package to facilitate the movement toward improved automation and sharing of behavioral classification tools across laboratories.
- year: 2024
  authors: Ouyang W, Kilner KJ, Xavier RMP, et al.
  title: An implantable device for wireless monitoring of diverse physio-behavioral characteristics in freely behaving small animals and interacting groups.
  journal: Neuron.
  detail: 2024 Jun 5;112(11):1764-1777.e5.
  doi: 10.1016/j.neuron.2024.02.020
  abstract: Ouyang W, Kilner KJ, Xavier RMP, Liu Y, Lu Y, Feller SM, Pitts KM, Wu M, Ausra J, Jones I, Wu Y, Luan H, Trueb J, Higbee-Dempsey EM, Stepien I, Ghoreishi-Haack N, Haney CR, Li H, Kozorovitskiy Y, Heshmati M, Banks AR, Golden SA*, Good CH*, Rogers JA*. Comprehensive, continuous quantitative monitoring of intricately orchestrated physiological processes and behavioral states in living organisms can yield essential data for elucidating the function of neural circuits under healthy and diseased conditions, for defining the effects of potential drugs and treatments, and for tracking disease progression and recovery. Here, we report a wireless, battery-free implantable device and a set of associated algorithms that enable continuous, multiparametric physio-behavioral monitoring in freely behaving small animals and interacting groups. Through advanced analytics approaches applied to mechano-acoustic signals of diverse body processes, the device yields heart rate, respiratory rate, physical
    activity, temperature, and behavioral states. Demonstrations in pharmacological, locomotor, and acute and social stress tests and in optogenetic studies offer unique insights into the coordination of physio-behavioral characteristics associated with healthy and perturbed states. This technology has broad utility in neuroscience, physiology, behavior, and other areas that rely on studies of freely moving, small animal models.
- year: 2024
  authors: Navarrete J, Schneider KN, Smith BM, et al.
  title: Individual Differences in Volitional Social Self-Administration and Motivation in Male and Female Mice Following Social Stress.
  journal: Biol Psychiatry.
  detail: 2024 Jan 18:S0006-3223(24)00033-7.
  doi: 10.1016/j.biopsych.2024.01.007
  abstract: 'Navarrete J, Schneider KN, Smith BM, Goodwin NL, Zhang YY, Salazar AS, Gonzalez YE, Anumolu P, Gross E, Tsai VS, Heshmati M, Golden SA. Background: A key challenge in developing treatments for neuropsychiatric illness is the disconnect between preclinical models and the complexity of human social behavior. We integrate voluntary social self-administration into a rodent model of social stress as a platform for the identification of fundamental brain and behavior mechanisms underlying stress-induced individual differences in social motivation. Methods: Here, we introduced an operant social stress procedure in male and female mice composed of 3 phases: 1) social self-administration training, 2) social stress exposure concurrent with reinforced self-administration testing, and 3) poststress operant testing under nonreinforced and reinforced conditions. We used social-defeat and witness-defeat stress in male and female mice. Results: Social defeat attenuated social reward seeking
    in males but not females, whereas witness defeat had no effect in males but promoted seeking behavior in females. We resolved social stress-induced changes to social motivation by aggregating z-scored operant metrics into a cumulative social index score to describe the spectrum of individual differences exhibited during operant social stress. Clustering does not adequately describe the relative distributions of social motivation following stress and is better described as a nonbinary behavioral distribution defined by the social index score, capturing a dynamic range of stress-related alterations in social motivation inclusive of sex as a biological variable. Conclusions: We demonstrated that operant social stress can detect stable individual differences in stress-induced changes to social motivation. The inclusion of volitional behavior in social procedures may enhance the understanding of behavioral adaptations that promote stress resiliency and their mechanisms under more naturalistic
    conditions.'
- year: 2023
  authors: Wohlschlegel J, Finkbeiner C, Hoffer D, et al.
  title: ASCL1 induces neurogenesis in human Müller glia.
  journal: Stem Cell Reports.
  detail: 2023 Dec 12;18(12):2400-2417.
  doi: 10.1016/j.stemcr.2023.10.021
  abstract: 'Wohlschlegel J, Finkbeiner C, Hoffer D, Kierney F, Prieve A, Murry AD, Haugan AK, Ortuño-Lizarán I, Rieke F, Golden SA, Reh TA. In mammals, loss of retinal cells due to disease or trauma is an irreversible process that can lead to blindness. Interestingly, regeneration of retinal neurons is a well established process in some non-mammalian vertebrates and is driven by the Müller glia (MG), which are able to re-enter the cell cycle and reprogram into neurogenic progenitors upon retinal injury or disease. Progress has been made to restore this mechanism in mammals to promote retinal regeneration: MG can be stimulated to generate new neurons in vivo in the adult mouse retina after the over-expression of the pro-neural transcription factor Ascl1. In this study, we applied the same strategy to reprogram human MG derived from fetal retina and retinal organoids into neurons. Combining single cell RNA sequencing, single cell ATAC sequencing, immunofluorescence, and electrophysiology
    we demonstrate that human MG can be reprogrammed into neurogenic cells in vitro.'

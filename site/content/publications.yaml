  authors: Goodwin NL, Anumolu P, Hoffman NP, Barrow AC, Tsai VS, MacMillen LK, Golden SA, Heshmati M.
  title: Attack repertoires in outbred male CD1-mice are associated with nucleus accumbens neuroligin-2.
  journal: eNeuro.
  detail: 2026 Apr 24;13(5):ENEURO.0471-25.2026.
  doi: 10.1523/ENEURO.0471-25.2026
  abstract: Aggression may be behaviorally distinguished by reactive or appetitive properties. Here, we use a model of operant aggression administration, in which outbred male CD-1 mice lever press (contingent) or do not lever press (noncontingent) to attack an intruder mouse, to examine behavioral differences in aggression reinforcement. Contingent reinforcement identifies the behavioral and neural basis of appetitive, or rewarding, aggression self-administration, while noncontingent reinforcement isolates reactive, or involuntary, components. Females are not used in this study due to their low propensity to attack. We applied supervised machine-guided behavioral classification and Shapley additive scores (SHAP) to describe differences and similarities in attack behavior features. We find that behavioral sequences of an attack bout are similar whether aggression reinforcement is contingent or noncontingent, though underlying neural mechanisms differ. Fos immunolabeling following operant reinforcement reveals distinct network activity patterns between contingent and noncontingent groups, supporting distinct neural mechanisms in appetitive or reactive aggression. We further identify high Fos activity in nucleus accumbens (NAc) in both contingent and noncontingent groups. NAc activity and changes in NAc neuroligin-2 (NLGN2) expression are associated with aggressive behavior. We find that the number of attack bouts is negatively correlated with NAc NLGN2 immunolabeling, regardless of contingent or noncontingent intruder presentation. As a result, molecularly dissociable features do not necessarily reflect operant behavioral repertoires.
- year: 2025
  authors: Toddes C, Golden SA.
  title: 'Behavioral neuroscience: Dominance in the absence of competition.'
  journal: Curr Biol.
  detail: 2025 Jul 21;35(14):R706-R708.
  doi: 10.1016/j.cub.2025.05.058
  abstract: Mice infer dominance rank using chemosensory cues rather than physical competition. This sensory-based inference reshapes how we think about hierarchy learning, stability, and behavioral flexibility in social animals.
- year: 2025
  authors: Simon RC, Fleming WT, Briones BA, Trzeciak M, Senthilkumar P, Ishii KK, Hjort MM, Martin MM, Hashikawa K, Sanders AD, Golden SA, Stuber GD.
  title: Opioid-driven disruption of the septum reveals a role for neurotensin-expressing neurons in withdrawal.
  journal: Neuron.
  detail: 2025 May 14:S0896-6273(25)00307-1.
  doi: 10.1016/j.neuron.2025.04.024
  abstract: Opioid withdrawal is an intensively aversive experience and often drives relapse. The lateral septum (LS) is a forebrain structure that is important in aversion processing and has been linked to substance use disorders, but which LS cell types contribute to the maladaptive state of withdrawal is unknown. We used single-nucleus RNA sequencing to interrogate cell-type-specific gene expression changes induced by chronic morphine exposure and discovered that morphine globally disrupts LS cell types, but neurotensin-expressing neurons (LS-Nts) are selectively activated by naloxone. Using two-photon calcium imaging and ex vivo electrophysiology, we next demonstrate that LS-Nts neurons receive elevated glutamatergic drive in morphine-dependent mice and remain hyperactivated during withdrawal. Finally, we show that manipulating LS-Nts neurons during opioid withdrawal regulates pain coping and sociability. Together, these results suggest that LS-Nts neurons are a key neural substrate
    involved in opioid withdrawal and establish the LS as a crucial regulator of adaptive behaviors.
- year: 2025
  authors: Luskin AT, Li L, Fu X, Martin MM, Barcomb K, Girven KS, Blackburn T, Wells BA, Thai ST, Li EM, Rana AN, Simon RC, Sun L, Gao L, Murry AD, Golden SA, Stuber GD, Ford CP, Gu L, Bruchas MR.
  title: Heterogeneous pericoerulear neurons tune arousal and exploratory behaviours.
  journal: Nature.
  detail: 2025 May 7.
  doi: 10.1038/s41586-025-08952-w
  abstract: As the primary source of noradrenaline in the brain, the locus coeruleus (LC) regulates arousal, avoidance and stress responses1,2. However, how local neuromodulatory inputs control LC function remains unresolved. Here we identify a population of transcriptionally, spatially and functionally diverse GABAergic (γ-aminobutyric acid-producing) neurons in the LC dendritic field that receive distant inputs and modulate modes of LC firing to control global arousal levels and arousal-related processing and behaviours. We define peri-LC anatomy using viral tracing and combine single-cell RNA sequencing with spatial transcriptomics to molecularly define both LC noradrenaline-producing and peri-LC cell types. We identify several neuronal cell types that underlie peri-LC functional diversity using a series of complementary neural circuit approaches in behaving mice. Our findings indicate that LC and peri-LC neurons are transcriptionally, functionally and anatomically heterogenous neuronal
    populations that modulate arousal and avoidance states. Defining the molecular, cellular and functional diversity of the LC and peri-LC provides a roadmap for understanding the neurobiological basis of arousal, motivation and neuropsychiatric disorders.

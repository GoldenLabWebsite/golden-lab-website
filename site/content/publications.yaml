  authors: Newton KC, Kacev D, Nilsson SRO, et al.
  title: Lateral line ablation by ototoxic compounds results in distinct rheotaxis profiles in larval zebrafish.
  journal: Commun Biol.
  detail: 2023 Jan 21;6(1):84.
  doi: 10.1038/s42003-023-04449-2
  abstract: Newton KC, Kacev D, Nilsson SRO, Saettele AL, Golden SA, Sheets L. The zebrafish lateral line is an established model for hair cell organ damage, yet few studies link mechanistic disruptions to changes in biologically relevant behavior. We used larval zebrafish to determine how damage via ototoxic compounds impact rheotaxis. Larvae were treated with CuSO4 or neomycin to disrupt lateral line function then exposed to water flow stimuli. Their swimming behavior was recorded on video then DeepLabCut and SimBA software were used to track movements and classify rheotaxis behavior, respectively. Lateral line-disrupted fish performed rheotaxis, but they swam greater distances, for shorter durations, and with greater angular variance than controls. Furthermore, spectral decomposition analyses confirmed that lesioned fish exhibited ototoxic compound-specific behavioral profiles with distinct changes in the magnitude, frequency, and cross-correlation between fluctuations in linear and angular
    movements. Our observations demonstrate that lateral line input is needed for fish to hold their station in flow efficiently and reveals that commonly used lesion methods have unique effects on rheotaxis behavior.
- year: 2022
  authors: Madangopal R, Szelenyi ER, Nguyen J, et al.
  title: Incubation of palatable food craving is associated with brain-wide neuronal activation in mice.
  journal: Proc Natl Acad Sci U S A.
  detail: 2022 Nov 8;119(45):e2209382119.
  doi: 10.1073/pnas.2209382119
  abstract: Madangopal R, Szelenyi ER, Nguyen J, Brenner MB, Drake OR, Pham DQ, Shekara A, Jin M, Choong JJ, Heins C, Komer LE, Weber SJ, Hope BT, Shaham Y, Golden SA. Studies using rodent models have shown that relapse to drug or food seeking increases progressively during abstinence, a behavioral phenomenon termed "incubation of craving." Mechanistic studies of incubation of craving have focused on specific neurobiological targets within preselected brain areas. Recent methodological advances in whole-brain immunohistochemistry, clearing, and imaging now allow unbiased brain-wide cellular resolution mapping of regions and circuits engaged during learned behaviors. However, these whole-brain imaging approaches were developed for mouse brains, while incubation of drug craving has primarily been studied in rats, and incubation of food craving has not been demonstrated in mice. Here, we established a mouse model of incubation of palatable food craving and examined food reward seeking after
    1, 15, and 60 abstinence days. We then used the neuronal activity marker Fos with intact-brain mapping procedures to identify corresponding patterns of brain-wide activation. Relapse to food seeking was significantly higher after 60 abstinence days than after 1 or 15 days. Using unbiased ClearMap analysis, we identified increased activation of multiple brain regions, particularly corticostriatal structures, following 60 but not 1 or 15 abstinence days. We used orthogonal SMART2 analysis to confirm these findings within corticostriatal and thalamocortical subvolumes and applied expert-guided registration to investigate subdivision and layer-specific activation patterns. Overall, we 1) identified brain-wide activity patterns during incubation of food seeking using complementary analytical approaches and 2) provide a single-cell resolution whole-brain atlas that can be used to identify functional networks and global architecture underlying the incubation of food craving.
- year: 2022
  authors: Aubry AV, Joseph Burnett C, Goodwin NL, et al.
  title: Sex differences in appetitive and reactive aggression.
  journal: Neuropsychopharmacology.
  detail: 2022 Sep;47(10):1746-1754.
  doi: 10.1038/s41386-022-01375-5
  abstract: Aubry AV, Joseph Burnett C, Goodwin NL, Li L, Navarrete J, Zhang Y, Tsai V, Durand-de Cuttoli R, Golden SA*, Russo SJ Aggression is an evolutionarily conserved, adaptive component of social behavior. Studies in male mice illustrate that aggression is influenced by numerous factors including the degree to which an individual finds aggression rewarding and will work for access to attack and subordinate mice. While such studies have expanded our understanding of the molecular and circuit mechanisms of male aggression very little is known about female aggression, within these established contexts. Here we use an ethologically relevant model of male vs. female aggression by pair housing adult male and female outbred CFW mice with opposite sex cage mates. We assess reactive (defensive) aggression in the resident intruder (RI) test and appetitive (rewarding) aggression in the aggression conditioned place preference (CPP) and operant self-administration (SA) tests. Our results show dramatic
    sex differences in both qualitative and quantitative aspects of reactive vs. appetitive aggression. Males exhibit more wrestling and less investigative behavior during RI, find aggression rewarding, and will work for access to a subordinate to attack. Females exhibit more bites, alternate between aggressive behaviors and investigative behaviors more readily during RI, however, they do not find aggression to be rewarding or reinforcing. These results establish sex differences in aggression in mice, providing an important resource for the field to better understand the circuit and molecular mechanisms of aggression in both sexes.
- year: 2022
  authors: Goodwin NL, Nilsson SRO, Choong JJ, Golden SA.
  title: Toward the explainability, transparency, and universality of machine learning for behavioral classification in neuroscience.
  journal: Curr Opin Neurobiol.
  detail: 2022 Apr;73:102544.
  doi: 10.1016/j.conb.2022.102544
  abstract: Goodwin NL, Nilsson SRO, Choong JJ, Golden SA. The use of rigorous ethological observation via machine learning techniques to understand brain function (computational neuroethology) is a rapidly growing approach that is poised to significantly change how behavioral neuroscience is commonly performed. With the development of open-source platforms for automated tracking and behavioral recognition, these approaches are now accessible to a wide array of neuroscientists despite variations in budget and computational experience. Importantly, this adoption has moved the field toward a common understanding of behavior and brain function through the removal of manual bias and the identification of previously unknown behavioral repertoires. Although less apparent, another consequence of this movement is the introduction of analytical tools that increase the explainabilty, transparency, and universality of the machine-based behavioral classifications both within and between research groups.
    Here, we focus on three main applications of such machine model explainabilty tools and metrics in the drive toward behavioral (i) standardization, (ii) specialization, and (iii) explainability. We provide a perspective on the use of explainability tools in computational neuroethology, and detail why this is a necessary next step in the expansion of the field. Specifically, as a possible solution in behavioral neuroscience, we propose the use of Shapley values via Shapley Additive Explanations (SHAP) as a diagnostic resource toward explainability of human annotation, as well as supervised and unsupervised behavioral machine learning analysis.
- year: 2022
  authors: Jin M, Nguyen JD, Weber SJ, et al.
  title: 'SMART: An Open-Source Extension of WholeBrain for Intact Mouse Brain Registration and Segmentation.'
  journal: eNeuro.
  detail: 2022 May 3;9(3):ENEURO.0482-21.2022.
  doi: 10.1523/ENEURO.0482-21.2022
  abstract: Jin M, Nguyen JD, Weber SJ, Mejias-Aponte CA, Madangopal R, Golden SA. Mapping immediate early gene (IEG) expression across intact mouse brains allows for unbiased identification of brain-wide activity patterns underlying complex behaviors. Accurate registration of sample brains to a common anatomic reference is critical for precise assignment of IEG-positive ("active") neurons to known brain regions of interest (ROIs). While existing automated voxel-based registration methods provide a high-throughput solution, they require substantial computing power, can be difficult to implement and fail when brains are damaged or only partially imaged. Additionally, it is challenging to cross-validate these approaches or compare them to any preexisting literature based on serial coronal sectioning. Here, we present the open-source R package SMART (Semi-Manual Alignment to Reference Templates) that extends the WholeBrain R package framework to automated segmentation and semi-automated registration
    of intact mouse brain light-sheet fluorescence microscopy (LSFM) datasets. The SMART package was created for novice programmers and introduces a streamlined pipeline for aligning, registering, and segmenting LSFM volumetric datasets across the anterior-posterior (AP) axis, using a simple "choice game" and interactive menus. SMART provides the flexibility to register whole brains, partial brains or discrete user-chosen images, and is fully compatible with traditional sectioned coronal slice-based analyses. We demonstrate SMART's core functions using example datasets and provide step-by-step video tutorials for installation and implementation of the package. We also present a modified iDISCO+ tissue clearing procedure for uniform immunohistochemical labeling of the activity marker Fos across intact mouse brains. The SMART pipeline, in conjunction with the modified iDISCO+ Fos procedure, is ideally suited for examination and orthogonal cross-validation of brain-wide neuronal activation
    datasets.
- year: 2022
  authors: Marks RB, Wee JY, Jacobson SV, et al.
  title: 'The Role of the Lateral Habenula in Suicide: A Call for Further Exploration.'
  journal: Front Behav Neurosci.
  detail: 2022 Mar 14;16:812952.
  doi: 10.3389/fnbeh.2022.812952
  abstract: Marks RB, Wee JY, Jacobson SV, Hashimoto K, O'Connell KL, Golden SA, Baker PM, Law KC Despite decades of significant effort in research, policy, and prevention, suicide rates have continued to rise to the current peak of 14.6 per 100,000 deaths. This has resulted in a concerted effort to identify biomarkers associated with suicidal behavior in the brain, to provide predictions that are better than the chance of discerning who will die by suicide. We propose that the lateral habenula (LHb), and its dysfunction during a suicidal crisis, is a critical component of the transition from suicidal ideations to self-harm. Moreover, the LHb-a key functional node in brain reward circuitry-has not been ascribed a contributory role in suicidal behavior. We argue that the LHb anchors a "suicide circuit" and call for suicide researchers to directly examine the role of the LHb, and its long-term modulation, in response to the negative affect in suicidal behavior. Discerning the neural mechanisms
    of this contribution will require the collaboration of neuroscientists and psychologists. Consequently, we highlight and discuss research on LHb as it relates to suicidal ideation, suicidal behavior, or death by suicide. In so doing we hope to address the bench-to-bedside translational issues currently involved in suicide research and suggest a developmental framework that focuses on specific structures motivated by theoretical anchors as a way to incorporate neurobiological findings within the context of clinical theory.
- year: 2022
  authors: Winters C, Gorssen W, Ossorio-Salazar VA, et al.
  title: Automated procedure to assess pup retrieval in laboratory mice.
  journal: Sci Rep.
  detail: 2022 Jan 31;12(1):1663.
  doi: 10.1038/s41598-022-05641-w
  abstract: Winters C, Gorssen W, Ossorio-Salazar VA, Nilsson S, Golden S, D'Hooge R. Despite decades of significant effort in research, policy, and prevention, suicide rates have continued to rise to the current peak of 14.6 per 100,000 deaths. This has resulted in a concerted effort to identify biomarkers associated with suicidal behavior in the brain, to provide predictions that are better than the chance of discerning who will die by suicide. We propose that the lateral habenula (LHb), and its dysfunction during a suicidal crisis, is a critical component of the transition from suicidal ideations to self-harm. Moreover, the LHb-a key functional node in brain reward circuitry-has not been ascribed a contributory role in suicidal behavior. We argue that the LHb anchors a "suicide circuit" and call for suicide researchers to directly examine the role of the LHb, and its long-term modulation, in response to the negative affect in suicidal behavior. Discerning the neural mechanisms of this
    contribution will require the collaboration of neuroscientists and psychologists. Consequently, we highlight and discuss research on LHb as it relates to suicidal ideation, suicidal behavior, or death by suicide. In so doing we hope to address the bench-to-bedside translational issues currently involved in suicide research and suggest a developmental framework that focuses on specific structures motivated by theoretical anchors as a way to incorporate neurobiological findings within the context of clinical theory.
- year: 2021
  authors: Szelenyi ER, Goodwin NL, Golden SA.
  title: Social mice seeking circuits.
  journal: Nature Neuroscience.
  detail: 2021 Jun;24(6):761-762.
  doi: 10.1038/s41593-021-00861-1
  abstract: Szelenyi ER, Goodwin NL, Golden SA. Hu et al. show that the posterodorsal medial amygdala selectively controls social-reward seeking through its intersection with canonical dopaminergic reward circuits. To identify this circuitry, the authors developed an elegant new affiliative social operant procedure that separates social interaction from social-reward seeking.
- year: 2021
  authors: Kwiatkowski CC, Akaeze H, Ndlebe I, et al.
  title: Quantitative standardization of resident mouse behavior for studies of aggression and social defeat.
  journal: Neuropsychopharmacology.
  detail: 2021 Aug;46(9):1584-1593.
  doi: 10.1038/s41386-021-01018-1
  abstract: Kwiatkowski CC, Akaeze H, Ndlebe I, Goodwin N, Eagle AL, Moon K, Bender AR, Golden SA, Robison AJ. Territorial reactive aggression in mice is used to study the biology of aggression-related behavior and is also a critical component of procedures used to study mood disorders, such as chronic social defeat stress. However, quantifying mouse aggression in a systematic, representative, and easily adoptable way that allows direct comparison between cohorts within or between studies remains a challenge. Here, we propose a structural equation modeling approach to quantify aggression observed during the resident-intruder procedure. Using data for 658 sexually experienced CD-1 male mice generated by three research groups across three institutions over a 10-year period, we developed a higher-order confirmatory factor model wherein the combined contributions of latency to the first attack, number of attack bouts, and average attack duration on each trial day (easily observable metrics that
    require no specialized equipment) are used to quantify individual differences in aggression. We call our final model the Mouse Aggression Detector (MAD) model. Correlation analyses between MAD model factors estimated from multiple large datasets demonstrate generalizability of this measurement approach, and we further establish the stability of aggression scores across time within cohorts and demonstrate the utility of MAD for selecting aggressors which will generate a susceptible phenotype in social defeat experiments. Thus, this novel aggression scoring technique offers a systematic, high-throughput approach for aggressor selection in chronic social defeat stress studies and a more consistent and accurate study of mouse aggression itself.
- year: 2020
  authors: Goodwin NL, Nilsson SRO, Golden SA.
  title: 'Rage Against the Machine: Advancing the study of aggression ethology via machine learning.'
  journal: Psychopharmacology (Berl).
  detail: 2020 Sep;237(9):2569-2588.
  doi: 10.1007/s00213-020-05577-x
  abstract: 'Goodwin NL, Nilsson SRO, Golden SA. Rationale: Aggression, comorbid with neuropsychiatric disorders, exhibits with diverse clinical presentations and places a significant burden on patients, caregivers, and society. This diversity is observed because aggression is a complex behavior that can be ethologically demarcated as either appetitive (rewarding) or reactive (defensive), each with its own behavioral characteristics, functionality, and neural basis that may transition from adaptive to maladaptive depending on genetic and environmental factors. There has been a recent surge in the development of preclinical animal models for studying appetitive aggression-related behaviors and identifying the neural mechanisms guiding their progression and expression. However, adoption of these procedures is often impeded by the arduous task of manually scoring complex social interactions. Manual observations are generally susceptible to observer drift, long analysis times, and poor inter-rater
    reliability, and are further incompatible with the sampling frequencies required of modern neuroscience methods. Objectives: In this review, we discuss recent advances in the preclinical study of appetitive aggression in mice, paired with our perspective on the potential for machine learning techniques in producing automated, robust scoring of aggressive social behavior. We discuss critical considerations for implementing valid computer classifications within behavioral pharmacological studies. Key results: Open-source automated classification platforms can match or exceed the performance of human observers while removing the confounds of observer drift, bias, and inter-rater reliability. Furthermore, unsupervised approaches can identify previously uncharacterized aggression-related behavioral repertoires in model species. Discussion and conclusions: Advances in open-source computational approaches hold promise for overcoming current manual annotation caveats while also introducing and
    generalizing computational neuroethology to the greater behavioral neuroscience community. We propose that currently available open-source approaches are sufficient for overcoming the main limitations preventing wide adoption of machine learning within the context of preclinical aggression behavioral research.'
- year: 2020
  authors: Heshmati M, Christoffel DJ, LeClair K, et al.
  title: Depression and Social Defeat Stress Are Associated with Inhibitory Synaptic Changes in the Nucleus Accumbens.
  journal: J Neurosci.
  detail: 2020 Aug 5;40(32):6228-6233.
  doi: 10.1523/JNEUROSCI.2568-19.2020
  abstract: Heshmati M, Christoffel DJ, LeClair K, Cathomas F, Golden SA, Aleyasin H, Turecki G, Friedman AK, Han MH, Menard C, Russo SJ. Chronic stress in both humans and rodents induces a robust downregulation of neuroligin-2, a key component of the inhibitory synapse, in the NAc that modifies behavioral coping mechanisms and stress resiliency in mice. Here we extend this observation by examining the role of two other inhibitory synapse constituents, vesicular GABA transporter (vGAT) and gephyrin, in the NAc of male mice that underwent chronic social defeat stress (CSDS) and in patients with major depressive disorder (MDD). We first performed transcriptional profiling of vGAT and gephyrin in postmortem NAc samples from a cohort of healthy controls, medicated, and nonmedicated MDD patients. In parallel, we conducted whole-cell electrophysiology recordings in the NAc of stress-susceptible and stress-resilient male mice following 10 d of CSDS. Finally, we used immunohistochemistry to analyze
    protein levels of vGAT and gephyrin in the NAc of mice after CSDS. We found that decreased vGAT and gephyrin mRNA in the NAc of nonmedicated MDD patients is paralleled by decreased inhibitory synapse markers and decreased frequency of mini inhibitory postsynaptic currents (mIPSC) in the NAc of susceptible mice, indicating a reduction in the number of NAc inhibitory synapses that is correlated with depression-like behavior. Overall, these findings suggest a common state of reduced inhibitory tone in the NAc in depression and stress susceptibility.
- year: 2020
  authors: Flanigan ME, Aleyasin H, Li L, et al.
  title: Orexin signaling in GABAergic lateral habenula neurons modulates aggressive behavior in male mice.
  journal: Nat Neurosci.
  detail: 2020 May;23(5):638-650.
  doi: 10.1038/s41593-020-0617-7
  abstract: Flanigan ME, Aleyasin H, Li L, Burnett CJ, Chan KL, LeClair KB, Lucas EK, Matikainen-Ankney B, Durand-de Cuttoli R, Takahashi A, Menard C, Pfau ML, Golden SA, Bouchard S, Calipari ES, Nestler EJ, DiLeone RJ, Yamanaka A, Huntley GW, Clem RL, Russo SJ. Heightened aggression is characteristic of multiple neuropsychiatric disorders and can have various negative effects on patients, their families and the public. Recent studies in humans and animals have implicated brain reward circuits in aggression and suggest that, in subsets of aggressive individuals, domination of subordinate social targets is reinforcing. In this study, we showed that, in male mice, orexin neurons in the lateral hypothalamus activated a small population of glutamic acid decarboxylase 2 (GAD2)-expressing neurons in the lateral habenula (LHb) via orexin receptor 2 (OxR2) and that activation of these GAD2 neurons promoted male-male aggression and conditioned place preference for aggression-paired contexts. Moreover,
    LHb GAD2 neurons were inhibitory within the LHb and dampened the activity of the LHb as a whole. These results suggest that the orexin system is important for the regulation of inter-male aggressive behavior and provide the first functional evidence of a local inhibitory circuit within the LHb.
- year: 2020
  authors: Dudek KA, Dion-Albert L, Lebel M, et al.
  title: Molecular adaptations of the blood-brain barrier promote stress resilience vs. depression.
  journal: Proc Natl Acad Sci U S A.
  detail: 2020 Feb 11;117(6):3326-3336.
  doi: 10.1073/pnas.1914655117
  abstract: Dudek KA, Dion-Albert L, Lebel M, LeClair K, Labrecque S, Tuck E, Ferrer Perez C, Golden SA, Tamminga C, Turecki G, Mechawar N, Russo SJ, Menard C. Preclinical and clinical studies suggest that inflammation and vascular dysfunction contribute to the pathogenesis of major depressive disorder (MDD). Chronic social stress alters blood-brain barrier (BBB) integrity through loss of tight junction protein claudin-5 (cldn5) in male mice, promoting passage of circulating proinflammatory cytokines and depression-like behaviors. This effect is prominent within the nucleus accumbens, a brain region associated with mood regulation; however, the mechanisms involved are unclear. Moreover, compensatory responses leading to proper behavioral strategies and active resilience are unknown. Here we identify active molecular changes within the BBB associated with stress resilience that might serve a protective role for the neurovasculature. We also confirm the relevance of such changes to human depression
    and antidepressant treatment. We show that permissive epigenetic regulation of cldn5 expression and low endothelium expression of repressive cldn5-related transcription factor foxo1 are associated with stress resilience. Region- and endothelial cell-specific whole transcriptomic analyses revealed molecular signatures associated with stress vulnerability vs. resilience. We identified proinflammatory TNFα/NFκB signaling and hdac1 as mediators of stress susceptibility. Pharmacological inhibition of stress-induced increase in hdac1 activity rescued cldn5 expression in the NAc and promoted resilience. Importantly, we confirmed changes in HDAC1 expression in the NAc of depressed patients without antidepressant treatment in line with CLDN5 loss. Conversely, many of these deleterious CLDN5-related molecular changes were reduced in postmortem NAc from antidepressant-treated subjects. These findings reinforce the importance of considering stress-induced neurovascular pathology in depression and
    provide therapeutic targets to treat this mood disorder and promote resilience.
- year: 2021
  authors: Labonté B, Abdallah K, Maussion G, et al.
  title: Regulation of impulsive and aggressive behaviours by a novel lncRNA.
  journal: Mol Psychiatry.
  detail: 2021 Aug;26(8):3751-3764.
  doi: 10.1038/s41380-019-0637-4
  abstract: Labonté B, Abdallah K, Maussion G, Yerko V, Yang J, Bittar T, Quessy F, Golden SA, Navarro L, Checknita D, Gigek C, Lopez JP, Neve RL, Russo SJ, Tremblay RE, Côté G, Meaney MJ, Mechawar N, Nestler EJ, Turecki G. High impulsive and aggressive traits associate with poor behavioural self-control. Despite their importance in predicting behavioural negative outcomes including suicide, the molecular mechanisms underlying the expression of impulsive and aggressive traits remain poorly understood. Here, we identified and characterized a novel long noncoding RNA (lncRNA), acting as a regulator of the monoamine oxidase A (MAOA) gene in the brain, and named it MAOA-associated lncRNA (MAALIN). Our results show that in the brain of suicide completers, MAALIN is regulated by a combination of epigenetic mechanisms including DNA methylation and chromatin modifications. Elevated MAALIN in the dentate gyrus of impulsive-aggressive suicides was associated with lower MAOA expression. Viral overexpression
    of MAALIN in neuroprogenitor cells decreased MAOA expression while CRISPR-mediated knock out resulted in elevated MAOA expression. Using viral-mediated gene transfer, we confirmed that MAALIN in the hippocampus significantly decreases MAOA expression and exacerbates the expression of impulsive-aggressive behavioural traits in CD1 aggressive mice. Overall, our findings suggest that variations in DNA methylation mediate the differential expression of a novel lncRNA that acts on MAOA expression to regulate impulsive-aggressive behaviours.

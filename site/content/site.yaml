mission: >
  Understanding the neural mechanisms and circuits guiding motivated social behavior,
  with a special interest in aggression reward, addiction, and depression.
research_areas:
  - title: "Aggression"
    body: >
      Aggression is often comorbid with neuropsychiatric diseases, including drug addiction and
      depression. One form, appetitive aggression, exhibits symptomatology that mimics addiction
      and is hypothesized to arise from dysregulation of reward circuits. We focus on identifying
      the basic neural mechanisms driving appetitive aggression and its transition to
      maladaptive, addiction-like aggression seeking.
  - title: "Addiction"
    body: >
      We examine the roles of both pro- and anti-social behaviors in addiction processes,
      focusing on maladaptive appetitive aggression during withdrawal and relapse, as well as
      the neural circuits underlying opioid and other substance use disorders.
  - title: "Depression"
    body: >
      Inappropriate and maladaptive aggression is one of the most commonly self-reported
      diagnostic symptoms of depression. We are working to identify the mechanisms guiding this
      comorbidity, with the goal of identifying novel therapeutic approaches for treating
      aggression comorbid with depression.
  - title: "Pain"
    body: >
      A newer focus of the lab examines how pain shapes social behavior and social hierarchy.
      We investigate the neural circuits through which pain states modulate social interaction,
      aggression, and dominance, with the goal of understanding how chronic pain conditions
      contribute to social withdrawal and altered aggressive behavior.
  - title: "Methods Development"
    body: >
      The lab builds and shares open-source tools for behavioral neuroscience, including SimBA
      (Simple Behavioral Analysis), a machine-learning platform for classifying complex social
      behaviors, and ArgiNLS, a nuclear-localization strategy for scalable single-cell image
      segmentation. In collaboration with Neurolux, we are also developing wireless, implantable
      devices (BMADs) for monitoring physiology and behavior in freely-moving, group-housed
      animals.

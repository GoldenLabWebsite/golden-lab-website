mission: >
  Understanding the neural mechanisms and circuits guiding motivated social behavior,
  with a special interest in aggression reward, addiction, and depression.
research_areas:
  - title: "Appetitive Aggression"
    body: >
      Aggression is often comorbid with neuropsychiatric diseases, including drug addiction,
      depression, and PTSD. We examine how appetitive aggression mimics addiction symptomatology
      through dysregulation of reward circuits.
  - title: "Addiction"
    body: >
      We examine the roles of both pro- and anti-social behaviors in addiction processes,
      focusing on maladaptive appetitive aggression during withdrawal and relapse.
  - title: "Depression and PTSD"
    body: >
      We investigate the common and unique mechanisms behind inappropriate aggression as a
      diagnostic symptom, aiming to identify novel therapeutic approaches.
methods: >
  Chemogenetics, optogenetics, calcium imaging, whole-mount light-sheet fluorescent microscopy,
  and machine-learning approaches.

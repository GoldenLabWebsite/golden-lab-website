  - group: "Post-baccalaureate Trainees"
    members:
      - name: "Erica Sanchez, BS"
        role: "Post-baccalaureate Student (UW SOAR Program)"
        years: "2024-present"
        bio: >
          Erica received her associate degree from Elgin Community College before transferring to
          Seattle Pacific University, where she obtained her BS in Psychology with a concentration
          in Behavioral and Cognitive Neuroscience. At SPU, she worked under Dr. Baker with rodent
          models to investigate the neural circuitry of decision-making, behavior, and pain
          sensitivity. She is also interested in research on the effects of depression and
          addiction on behavior.
        photo: "people/sanchez.webp"
        links:
          - {label: "Email", url: "mailto:esanche@uw.edu"}


  - group: "Graduate Trainees"
    members:
      - name: "Nastacia Goodwin, BS"
        role: "Graduate Student"
        years: "2019-2024"
        bio: >
          Nastacia received her BA in psychology from Smith College (Northampton, MA) in 2014.
          She spent four years as a lab manager after graduation, first working with Dr.
          Annaliese Beery at Smith and then Dr. Devanand Manoli at UCSF studying the
          neurobiological underpinnings of peer versus mate sociality in voles. She is excited to
          use her experience with behavioral work and molecular biology to study the neural
          ensembles driving appetitive versus reactive aggression.
        photo: "people/goodwin.webp"
        links:
          - {label: "Curriculum Vitae", url: "https://goldenneurolab.com/s/2019-08-18-Goodwin-CV.pdf"}
          - {label: "Email", url: "mailto:ngoodwin@uw.edu"}

current:
  - group: "Leadership"
    members:
      - name: "Sam A. Golden, PhD"
        role: "Associate Professor"
        subroles:
          - "Director, Undergraduate Program in Neuroscience"
          - "Ronald S. Howell Distinguished Faculty Fellow"
          - "Department of Neurobiology & Biophysics, Primary"
          - "Department of Anesthesiology & Pain Medicine, Adjunct"
        years: ""
        bio: >
          Sam received his BS in Neuroscience from Bates College (Lewiston, ME) in 2006, PhD in
          Neuroscience from the Icahn School of Medicine (New York City, NY) in 2015 under Dr.
          Scott J. Russo, and completed his Postdoctoral Fellowship at the National Institute on
          Drug Abuse (Baltimore, MD) in 2018 under Dr. Yavin Shaham. Sam joined the University of
          Washington Department of Biological Structure in 2019, with a co-appointment as a
          participating faculty in the UW Center of Excellence in Neurobiology of Addiction,
          Pain, and Emotion (NAPE).

          Sam's scientific interests encompass understanding the psychological and neural
          mechanisms guiding reward processing. He is particularly interested in understanding
          how neuropsychiatric disorders — such as maladaptive aggression, depression and
          substance abuse — subvert basic reward circuitry to manifest pathological behavior.
          Currently, he aims to better define the intersection of aggression and motivation, and
          identify the cellular and circuit mechanisms that control the transition from adaptive
          aggression to maladaptive aggression-seeking behavior.
        photo: "people/golden.webp"
        links:
          - {label: "Curriculum Vitae", url: "static/files/golden-cv.pdf"}
          - {label: "Email", url: "mailto:sagolden@uw.edu"}
          - {label: "Google Scholar", url: "https://scholar.google.com/citations?user=fcR9Oa4AAAAJ&hl=en"}
          - {label: "PubMed", url: "https://www.ncbi.nlm.nih.gov/pubmed/?term=golden+sa"}

  - group: "Staff and Postdoctoral Fellows"
    members:
      - name: "Carlee Toddes, PhD"
        role: "Postdoctoral Fellow"
        years: "2022-present (co-mentored with Dr. Mitra Heshmati)"
        bio: >
          A postdoctoral research fellow specializing in the study of neural dynamics underlying
          pain-modulated social behavior. Carlee obtained her PhD from the University of
          Minnesota, where she conducted research in the Rothwell Lab investigating opioidergic
          mechanisms that underlie social affiliative behaviors. Beyond her laboratory work, she
          is deeply committed to promoting positive change in the scientific community through
          active involvement in science policy and advocacy.
        photo: "people/toddes.webp"
        links:
          - {label: "Email", url: "mailto:ctodde@uw.edu"}
          - {label: "Google Scholar", url: "https://scholar.google.com/citations?hl=en&user=oHKSXMEAAAAJ"}
          - {label: "PubMed", url: "https://pubmed.ncbi.nlm.nih.gov/?term=toddes+carlee&sort=pubdate&size=100"}
      - name: "Todd Appleby, PhD"
        role: "Postdoctoral Fellow"
        years: "2024-present"
        bio: >
          [DRAFT -- please edit] Todd is a postdoctoral fellow studying opioid use and relapse.
          He developed an oral fentanyl self-administration procedure in mice that captures
          volitional intake, cue-driven seeking, extinction, and relapse, revealing separable
          escalation-prone and relapse-prone phenotypes tied to genetic background. He is
          committed to sharing open protocols, hardware specifications, and analysis code to
          lower the barrier to adopting this model.
        photo: "people/appleby.webp"
        links: []


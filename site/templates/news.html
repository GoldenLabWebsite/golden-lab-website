{% extends "base.html" %}
{% block title %}News — {{ site.lab_name }}{% endblock %}
{% block content %}
<h1 class="page-title center-line">News</h1>
{% for item in news %}
<div class="news-entry">
  <p class="news-date">{{ item.date_display }}</p>
  <h3 class="news-title">{{ item.title }}</h3>
  <p class="news-body">{{ item.body }}</p>
</div>
<hr>
{% endfor %}
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<section class="wrap prose">
  <h1>{{ page.title }}</h1>
  <p>{{ page.intro }}</p>
  <p>{{ page.body }}</p>
  <h2>Availability</h2>
  <p>{{ page.availability }}</p>
  <p><a href="{{ page.publication.url }}" target="_blank" rel="noopener">{{ page.publication.label }}</a> — {{ page.recognition }}</p>
</section>
{% endblock %}

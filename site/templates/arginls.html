{% extends "base.html" %}
{% block title %}ArgiNLS — {{ site.lab_name }}{% endblock %}
{% block content %}
<h1 class="page-title center-line">{{ page.title }}</h1>
<p>{{ page.intro }}</p>
<p>{{ page.body }}</p>
<h3 class="eyebrow">Availability</h3>
<p>{{ page.availability }}</p>
<hr>
<p class="center-line"><a class="accent-link" href="{{ page.publication.url }}" target="_blank" rel="noopener">{{ page.publication.label | upper }}</a></p>
<p class="center-line muted">{{ page.recognition }}</p>
{% endblock %}

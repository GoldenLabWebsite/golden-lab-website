{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<section class="wrap prose">
  <h1>Contact</h1>
  <address>
    {% for line in site.address_lines %}{{ line }}<br>{% endfor %}
  </address>
  <p>Phone: {{ site.phone }}<br>
     Fax: {{ site.fax }}<br>
     Email: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
</section>
{% endblock %}

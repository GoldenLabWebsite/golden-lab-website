{% extends "base.html" %}
{% block title %}Contact — {{ site.lab_name }}{% endblock %}
{% block content %}
<h1 class="page-title center-line">Contact</h1>
<address class="center-line">
  {% for line in site.address_lines %}{{ line }}<br>{% endfor %}
</address>
<p class="center-line">
  Phone: {{ site.phone }}<br>
  Fax: {{ site.fax }}<br>
  Email: <a class="accent-link" href="mailto:{{ site.email }}">{{ site.email }}</a>
</p>
{% endblock %}

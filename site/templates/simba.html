{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<section class="wrap prose">
  <h1>{{ page.title }}</h1>
  <p>{{ page.intro }}</p>
  <ul class="link-list">
    {% for l in page.links %}
    <li><a href="{{ l.url }}" target="_blank" rel="noopener">{{ l.label }}</a></li>
    {% endfor %}
  </ul>
  <p class="muted">{{ page.contact_note }}</p>
</section>
{% endblock %}
